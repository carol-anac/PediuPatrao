<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary"
           sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${param.criado}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span>Pedido registrado com sucesso!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Cliente</th>
                        <th>Itens</th>
                        <th>Subtotal</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Responsável</th>
                        <th>Saída</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="10" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}"
                        th:with="st=${pedido.status != null ? pedido.status.name() : ''}">
                        <td class="ps-4"
                            th:text="${nomesClientes[pedido.clienteId] ?: pedido.clienteId}"></td>
                        <td>
                            <div th:each="item : ${pedido.itens}"
                                 th:text="${item.quantidade} + 'x ' + ${item.nomeProduto}"></div>
                        </td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorDesconto, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="fw-semibold"
                            th:text="'R$ ' + ${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${st == 'FINALIZADO'} ? 'bg-success' :
                                                  (${st == 'CANCELADO'} ? 'bg-danger' :
                                                  (${st == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${st == 'PRONTO'} ? 'bg-info text-dark' :
                                                  (${st == 'SAIU_PARA_ENTREGA' or st == 'RETIRADO'} ? 'bg-primary' : 'bg-secondary'))))"
                                  th:text="${st}">
                            </span>
                        </td>
                        <td th:text="${#temporals.format(pedido.dataEntrada, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${pedido.responsavelEntrada}"></td>
                        <td>
                            <span th:if="${pedido.dataSaida != null}"
                                  th:text="${#temporals.format(pedido.dataSaida, 'dd/MM HH:mm')} + ' (' + ${pedido.responsavelSaida} + ')'"></span>
                            <span th:if="${st == 'CANCELADO'}" class="text-danger small"
                                  th:title="${pedido.justificativaCancelamento}"
                                  th:text="'Cancelado por ' + ${pedido.responsavelCancelamento}"></span>
                        </td>
                        <td class="text-end pe-4 text-nowrap">
                            <!-- RF03: próximos status (GERENTE e ATENDENTE) -->
                            <th:block th:if="${pedido.status != null}">
                                <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                        sec:authorize="hasAnyRole('GERENTE','ATENDENTE')"
                                        th:each="prox : ${pedido.status.proximos()}"
                                        th:data-id="${pedido.id}" th:data-status="${prox.name()}"
                                        th:text="${prox.name()}"
                                        onclick="mudarStatus(this)"></button>
                                <!-- RF04: desconto e cancelamento (somente GERENTE, antes da saída) -->
                                <th:block th:if="${pedido.status.antesDaSaida()}">
                                    <button type="button" class="btn btn-sm btn-outline-success me-1"
                                            sec:authorize="hasRole('GERENTE')"
                                            th:data-id="${pedido.id}"
                                            onclick="aplicarDesconto(this)">Desconto</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            sec:authorize="hasRole('GERENTE')"
                                            th:data-id="${pedido.id}"
                                            onclick="cancelarPedido(this)">Cancelar</button>
                                </th:block>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

<script>
    function csrfHeaders() {
        const token = document.querySelector('meta[name="_csrf"]');
        const header = document.querySelector('meta[name="_csrf_header"]');
        const h = { 'Content-Type': 'application/json' };
        if (token && header) { h[header.content] = token.content; }
        return h;
    }

    async function enviar(url, metodo, corpo) {
        try {
            const r = await fetch(url, {
                method: metodo,
                headers: csrfHeaders(),
                body: corpo ? JSON.stringify(corpo) : undefined
            });
            if (r.ok) { location.reload(); return; }
            if (r.status === 403) { alert('Acesso negado: seu perfil não pode realizar esta operação.'); return; }
            let msg = 'Erro ' + r.status;
            try { const d = await r.json(); if (d.erro) msg = d.erro; } catch (e) { }
            alert(msg);
        } catch (e) {
            alert('Falha de comunicação com o servidor.');
        }
    }

    function mudarStatus(btn) {
        const id = btn.dataset.id, status = btn.dataset.status;
        if (!confirm('Mudar o pedido para ' + status + '?')) return;
        enviar('/api/pedidos/' + encodeURIComponent(id) + '/status?status=' + encodeURIComponent(status), 'PUT');
    }

    function aplicarDesconto(btn) {
        const valor = prompt('Percentual de desconto (0 a 20):');
        if (valor === null) return;
        const percentual = Number(valor.replace(',', '.'));
        if (valor.trim() === '' || isNaN(percentual)) { alert('Informe um número válido.'); return; }
        enviar('/api/pedidos/' + encodeURIComponent(btn.dataset.id) + '/desconto', 'PUT', { percentual: percentual });
    }

    function cancelarPedido(btn) {
        const justificativa = prompt('Justificativa do cancelamento (obrigatória):');
        if (justificativa === null) return;
        enviar('/api/pedidos/' + encodeURIComponent(btn.dataset.id) + '/cancelar', 'POST', { justificativa: justificativa });
    }
</script>

</body>
</html>
