<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary"
           sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${param.criado}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span>Pedido registrado com sucesso!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Cliente</th>
                        <th>Itens</th>
                        <th>Subtotal</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Responsável</th>
                        <th>Saída</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="10" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}"
                        th:with="st=${pedido.status != null ? pedido.status.name() : ''}">
                        <td class="ps-4"
                            th:text="${nomesClientes[pedido.clienteId] ?: pedido.clienteId}"></td>
                        <td>
                            <div th:each="item : ${pedido.itens}"
                                 th:text="${item.quantidade} + 'x ' + ${item.nomeProduto}"></div>
                        </td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorDesconto, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="fw-semibold"
                            th:text="'R$ ' + ${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${st == 'FINALIZADO'} ? 'bg-success' :
                                                  (${st == 'CANCELADO'} ? 'bg-danger' :
                                                  (${st == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${st == 'PRONTO'} ? 'bg-info text-dark' :
                                                  (${st == 'SAIU_PARA_ENTREGA' or st == 'RETIRADO'} ? 'bg-primary' : 'bg-secondary'))))"
                                  th:text="${st == 'RECEBIDO' ? 'Recebido' :
                                             (st == 'EM_PREPARACAO' ? 'Em preparação' :
                                             (st == 'PRONTO' ? 'Pronto' :
                                             (st == 'SAIU_PARA_ENTREGA' ? 'Saiu para entrega' :
                                             (st == 'RETIRADO' ? 'Retirado' :
                                             (st == 'FINALIZADO' ? 'Finalizado' :
                                             (st == 'CANCELADO' ? 'Cancelado' : st))))))}">
                            </span>
                        </td>
                        <td th:text="${#temporals.format(pedido.dataEntrada, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${pedido.responsavelEntrada}"></td>
                        <td>
                            <span th:if="${pedido.dataSaida != null}"
                                  th:text="${#temporals.format(pedido.dataSaida, 'dd/MM HH:mm')} + ' (' + ${pedido.responsavelSaida} + ')'"></span>
                            <span th:if="${st == 'CANCELADO'}" class="text-danger small"
                                  th:title="${pedido.justificativaCancelamento}"
                                  th:text="'Cancelado por ' + ${pedido.responsavelCancelamento}"></span>
                        </td>
                        <td class="text-end pe-4 text-nowrap">
                            <!-- RF03: próximos status (GERENTE e ATENDENTE) -->
                            <th:block th:if="${pedido.status != null}">
                                <form class="d-inline" method="post"
                                      sec:authorize="hasAnyRole('GERENTE','ATENDENTE')"
                                      th:each="prox : ${pedido.status.proximos()}"
                                      th:action="@{/pedidos/{id}/status(id=${pedido.id})}"
                                      onsubmit="return confirm('Confirmar esta ação para o pedido?');">
                                    <input type="hidden" name="status" th:value="${prox.name()}" />
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-primary me-1"
                                            th:with="acao=${prox.name() == 'EM_PREPARACAO' ? 'Iniciar preparo' :
                                                           (prox.name() == 'PRONTO' ? 'Marcar como pronto' :
                                                           (prox.name() == 'SAIU_PARA_ENTREGA' ? 'Enviar para entrega' :
                                                           (prox.name() == 'RETIRADO' ? 'Registrar retirada' :
                                                           (prox.name() == 'FINALIZADO' ? 'Finalizar pedido' : prox.name()))))}"
                                            th:text="${acao}"></button>
                                </form>
                                <!-- RF04: desconto e cancelamento (somente GERENTE, antes da saída) -->
                                <th:block th:if="${pedido.status.antesDaSaida()}">
                                    <details class="pedido-acao-detalhe me-1" sec:authorize="hasRole('GERENTE')">
                                        <summary class="btn btn-sm btn-outline-success">Desconto</summary>
                                        <form class="pedido-acao-form" method="post"
                                              th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}">
                                            <label class="form-label small mb-1" th:for="|desconto-${pedido.id}|">Percentual (0 a 20%)</label>
                                            <input class="form-control form-control-sm mb-2" type="number" name="percentual"
                                                   min="0" max="20" step="0.01" required="required"
                                                   th:id="|desconto-${pedido.id}|" />
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-success w-100">Aplicar desconto</button>
                                        </form>
                                    </details>
                                    <details class="pedido-acao-detalhe" sec:authorize="hasRole('GERENTE')">
                                        <summary class="btn btn-sm btn-outline-danger">Cancelar</summary>
                                        <form class="pedido-acao-form" method="post"
                                              th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}">
                                            <label class="form-label small mb-1" th:for="|justificativa-${pedido.id}|">Justificativa (5 a 300 caracteres)</label>
                                            <textarea class="form-control form-control-sm mb-2" name="justificativa"
                                                      minlength="5" maxlength="300" rows="3" required="required"
                                                      th:id="|justificativa-${pedido.id}|"></textarea>
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-danger w-100">Confirmar cancelamento</button>
                                        </form>
                                    </details>
                                </th:block>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
