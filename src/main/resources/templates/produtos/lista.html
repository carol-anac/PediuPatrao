<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-box-seam me-2 text-primary"></i>Produtos
        </h2>
        <button type="button" class="btn btn-primary" onclick="novoProduto()">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <!-- Formulário (cadastro e edição) -->
    <div class="card shadow-sm mb-4" id="cartaoProduto" style="display:none;">
        <div class="card-body">
            <h5 class="mb-3" id="tituloForm">Novo produto</h5>
            <input type="hidden" id="produtoId">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" class="form-control" maxlength="80" placeholder="Ex.: Pizza Calabresa">
                </div>
                <div class="col-md-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select id="tipo" class="form-select">
                        <option value="Pizza">Pizza</option>
                        <option value="Esfiha">Esfiha</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="preco" class="form-label">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control" step="0.01" min="0.01" placeholder="45.00">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="form-check">
                        <input type="checkbox" id="ativo" class="form-check-input" checked>
                        <label for="ativo" class="form-check-label">Produto ativo</label>
                    </div>
                </div>
            </div>
            <div class="mt-3 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary" onclick="fecharForm()">Cancelar</button>
                <button type="button" class="btn btn-success" onclick="salvarProduto()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')} : '-'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${produto.ativo == null or produto.ativo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${produto.ativo == null or produto.ativo} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td class="text-end pe-4 text-nowrap">
                            <button type="button" class="btn btn-sm btn-outline-warning me-1"
                                    th:data-id="${produto.id}" th:data-nome="${produto.nome}"
                                    th:data-tipo="${produto.tipo}" th:data-preco="${produto.preco}"
                                    th:data-ativo="${produto.ativo == null or produto.ativo}"
                                    onclick="editarProduto(this)">Editar</button>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    th:data-id="${produto.id}"
                                    onclick="excluirProduto(this)">Excluir</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function csrfHeaders() {
            const token = document.querySelector('meta[name="_csrf"]');
            const header = document.querySelector('meta[name="_csrf_header"]');
            const h = { 'Content-Type': 'application/json' };
            if (token && header) { h[header.content] = token.content; }
            return h;
        }

        async function enviarProduto(url, metodo, corpo) {
            try {
                const r = await fetch(url, {
                    method: metodo,
                    headers: csrfHeaders(),
                    body: corpo ? JSON.stringify(corpo) : undefined
                });
                if (r.ok) { location.reload(); return; }
                if (r.status === 403) { alert('Acesso negado: seu perfil não pode alterar produtos.'); return; }
                let msg = 'Erro ' + r.status;
                try { const d = await r.json(); if (d.erro) msg = d.erro; } catch (e) { }
                alert(msg);
            } catch (e) {
                alert('Falha de comunicação com o servidor.');
            }
        }

        function abrirForm(titulo) {
            document.getElementById('tituloForm').textContent = titulo;
            document.getElementById('cartaoProduto').style.display = 'block';
        }

        function fecharForm() {
            document.getElementById('cartaoProduto').style.display = 'none';
        }

        function novoProduto() {
            document.getElementById('produtoId').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('tipo').value = 'Pizza';
            document.getElementById('preco').value = '';
            document.getElementById('ativo').checked = true;
            abrirForm('Novo produto');
        }

        function editarProduto(btn) {
            document.getElementById('produtoId').value = btn.dataset.id;
            document.getElementById('nome').value = btn.dataset.nome || '';
            document.getElementById('tipo').value = btn.dataset.tipo || 'Pizza';
            document.getElementById('preco').value = btn.dataset.preco || '';
            document.getElementById('ativo').checked = btn.dataset.ativo === 'true';
            abrirForm('Editar produto');
        }

        function salvarProduto() {
            const id = document.getElementById('produtoId').value;
            const produto = {
                nome: document.getElementById('nome').value.trim(),
                tipo: document.getElementById('tipo').value,
                preco: parseFloat(document.getElementById('preco').value),
                ativo: document.getElementById('ativo').checked
            };
            if (!produto.nome) { alert('Informe o nome.'); return; }
            if (isNaN(produto.preco) || produto.preco <= 0) { alert('Informe um preço maior que zero.'); return; }
            if (id) {
                enviarProduto('/api/produtos/' + encodeURIComponent(id), 'PUT', produto);
            } else {
                enviarProduto('/api/produtos', 'POST', produto);
            }
        }

        function excluirProduto(btn) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;
            enviarProduto('/api/produtos/' + encodeURIComponent(btn.dataset.id), 'DELETE');
        }
    </script>

</div>

</body>
</html>
